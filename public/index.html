<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Ambulance AI — Emergency Routing System</title>
  <meta name="description" content="AI-Powered Emergency Ambulance Routing and Traffic Coordination System."/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(21,101,192,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(211,47,47,0.12) 0%, transparent 60%),
        var(--bg-dark);
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none;
    }
    .hero { text-align: center; max-width: 520px; padding: 24px; position: relative; z-index: 1; }
    .hero-siren { font-size: 5rem; display: block; filter: drop-shadow(0 0 30px var(--red-hot)); animation: pulse-red 2s infinite; margin-bottom: 20px; }
    .hero h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--blue-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; }
    .hero p  { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 32px; line-height: 1.7; }
    .hero-actions { display: flex; flex-direction: column; gap: 10px; }
    .redirect-msg { font-size: 0.8rem; color: var(--text-muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="hero fade-in-up">
    <span class="hero-siren">🚨</span>
    <h1>Smart Ambulance AI</h1>
    <p>AI-Powered Emergency Ambulance Routing & Traffic Coordination System. Reducing ambulance travel time through intelligent routing and real-time police coordination.</p>
    <div class="hero-actions">
      <button class="btn btn-emergency btn-lg" onclick="window.location.href='/login.html'">🚑 Enter System</button>
    </div>
    <p class="redirect-msg">Redirecting to login in <span id="countdown">3</span>s…</p>
  </div>
  <script>
    // Auto-redirect if already logged in
    const token = localStorage.getItem('token');
    const role  = localStorage.getItem('role');
    if (token && role) {
      window.location.href = role === 'ambulance' ? '/ambulance-dashboard.html' : '/police-dashboard.html';
    } else {
      let n = 3;
      const interval = setInterval(() => {
        n--;
        const el = document.getElementById('countdown');
        if (el) el.textContent = n;
        if (n <= 0) { clearInterval(interval); window.location.href = '/login.html'; }
      }, 1000);
    }
  </script>
</body>
</html>
